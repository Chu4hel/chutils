[project]
name = "chutils"
version = "3.0.0"
description = "Набор простых и удобных утилит для Python, который избавляет от рутины при работе с конфигурацией и логированием в новых проектах."
authors = [{name = "Chu4hel", email = "sergeiivanov636@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml (>=6.0.3)",
    "python-dotenv (>=1.2.2)"
]

[project.optional-dependencies]
secrets = ["keyring (>=25.7.0)"]
pydantic = ["pydantic (>=2.13.4,<3.0.0)"]
json = ["python-json-logger (>=3.2.1)"]
watch = ["watchdog (>=6.0.0)"]
rich = ["rich (>=15.0.0)"]
date = ["python-dateutil (>=2.9.0)"]
metrics = ["prometheus-client (>=0.20.0,<1.0.0)"]
text = ["rapidfuzz (>=3.9.0)"]
crypto = ["cryptography (>=42.0.0)"]
testing = [
    "pytest (>=9.0.3)"
]
otel = [
    "opentelemetry-api (>=1.41.1)",
    "opentelemetry-sdk (>=1.41.1)",
    "opentelemetry-exporter-otlp (>=1.41.1)"
]
full = [
    "pydantic (>=2.13.4)",
    "python-json-logger (>=3.2.1)",
    "watchdog (>=6.0.0)",
    "rich (>=15.0.0)",
    "python-dateutil (>=2.9.0)",
    "opentelemetry-api (>=1.41.1)",
    "opentelemetry-sdk (>=1.41.1)",
    "opentelemetry-exporter-otlp (>=1.41.1)",
    "keyring (>=25.7.0)",
    "prometheus-client (>=0.20.0,<1.0.0)",
    "rapidfuzz (>=3.9.0)",
    "cryptography (>=42.0.0)",
    "pytest (>=9.0.3)"
]

[project.scripts]
chutils = "chutils.cli:main"

[tool.poetry]
packages = [{ include = "chutils", from = "src" }]
exclude = [
    "tests/",
    "site/",
    "examples/",
    "docs/",
    ".github/",
    ".idea/",
    "__pycache__/",
    "*.pyc",
    "*.log",
    "*.egg-info/",
    ".vscode/",
    ".ruff_cache/",
    "coverage.xml",
    ".coverage",
    "PUBLISHING.md",
    "project.txt",
    "changelog.txt",
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-mock = "^3.15.1"
pyfakefs = "^6.2.0"
mkdocs = "^1.6.1"
mkdocs-material = "^9.7.5"
mkdocstrings = "^1.0.4"
mkdocstrings-python = "^2.0.3"
pytest-cov = "^7.1.0"
pytest-asyncio = "^1.3.0"
ruff = "^0.15.12"
rich = "^15.0.0"
mypy = "^2.1.0"
fastapi = "^0.110.0"
httpx = "^0.27.0"
prometheus-client = "^0.20.0"
rapidfuzz = "^3.9.0"
cryptography = "^42.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = [
    "src"
]

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true

[tool.chutils.ai-lint]
strict = false
ignore = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "tests",
    "site",
    "examples",
    "docs",
    "src/chutils/testing",
    "src/chutils/typing.py"
]