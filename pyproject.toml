[project]
name = "chutils"
version = "3.3.2"
description = "Набор простых и удобных утилит для Python, который избавляет от рутины при работе с конфигурацией и логированием в новых проектах."
authors = [{ name = "Chu4hel", email = "sergeiivanov636@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "pyyaml (>=6.0.3)",
    "python-dotenv (>=1.2.2)",
    "exceptiongroup (>=1.2.2) ; python_version < '3.11'"
]

[project.optional-dependencies]
secrets = ["keyring (>=25.7.0)"]
aws = ["boto3 (>=1.34.0)"]
gcp = ["google-cloud-secret-manager (>=2.20.0)"]
pydantic = ["pydantic (>=2.13.4,<3.0.0)"]
json = ["python-json-logger (>=3.2.1)"]
watch = ["watchdog (>=6.0.0)"]
rich = ["rich (>=15.0.0)"]
date = ["python-dateutil (>=2.9.0)"]
metrics = ["prometheus-client (>=0.20.0,<1.0.0)"]
text = ["rapidfuzz (>=3.9.0)"]
crypto = ["cryptography (>=42.0.0)"]
web = ["httpx (>=0.27.0)"]
websockets = ["websockets (>=14.0.0)"]
db = [
    "sqlalchemy (>=2.0.0)",
    "asyncpg (>=0.29.0)",
    "aiosqlite (>=0.20.0)",
    "alembic (>=1.13.0)",
]
captcha = ["httpx (>=0.27.0)"]
scraping = [
    "playwright (>=1.49.0)",
    "selenium (>=4.27.0)"
]
testing = [
    "pytest (>=9.0.3)"
]
otel = [
    "opentelemetry-api (>=1.41.1)",
    "opentelemetry-sdk (>=1.41.1)",
    "opentelemetry-exporter-otlp (>=1.41.1)"
]
full = [
    "pydantic (>=2.13.4)",
    "python-json-logger (>=3.2.1)",
    "watchdog (>=6.0.0)",
    "rich (>=15.0.0)",
    "python-dateutil (>=2.9.0)",
    "opentelemetry-api (>=1.41.1)",
    "opentelemetry-sdk (>=1.41.1)",
    "opentelemetry-exporter-otlp (>=1.41.1)",
    "keyring (>=25.7.0)",
    "prometheus-client (>=0.20.0,<1.0.0)",
    "rapidfuzz (>=3.9.0)",
    "cryptography (>=42.0.0)",
    "httpx (>=0.27.0)",
    "websockets (>=14.0.0)",
    "playwright (>=1.49.0)",
    "selenium (>=4.27.0)",
    "pytest (>=9.0.3)",
    "boto3 (>=1.34.0)",
    "google-cloud-secret-manager (>=2.20.0)"
]

[project.scripts]
chutils = "chutils.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chutils"]

[dependency-groups]
dev = [
    "pytest (>=9.0.3)",
    "pytest-mock (>=3.15.1)",
    "pytest-cov (>=7.1.0)  ; python_version < '3.14'",
    "pytest-asyncio (>=1.3.0)",
    "pyfakefs (>=6.2.0)",
    "mkdocs (>=1.6.1)",
    "mkdocs-material (>=9.7.5)",
    "mkdocstrings (>=1.0.4) ; python_version < '3.14'",
    "mkdocstrings-python (>=2.0.3)",
    "ruff (>=0.15.12)",
    "mypy (>=2.1.0)",
    "fastapi (>=0.110.0)",
    "websockets (>=14.0.0)",
]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = [
    "src"
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated"
]


[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true

[tool.chutils.ai-lint]
strict = false
ignore = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "tests",
    "site",
    "examples",
    "docs",
    "src/chutils/testing",
    "src/chutils/typing.py"
]

[tool.bumpversion]
current_version = "3.2.0"
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
