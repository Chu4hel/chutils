[dependencies]
# При изменении исходного кода chutils необходимо перегенерировать карту API и семантический индекс
"src/chutils/**/*.py" = ["api_map.md", "project_index.json"]

# При создании новых правил линтера необходимо дополнить документацию по линтеру и командам разработчика
"new:src/chutils/dev/rules/*.py" = ["docs/ai_lint.md", "docs/cli/dev.md"]

# При изменении CLI команд необходимо обновить документацию по интерфейсу командной строки
"src/chutils/commands/**/*.py" = ["docs/cli/dev.md"]
