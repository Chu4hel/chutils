[dependencies]
# При изменении исходного кода chutils необходимо перегенерировать карту API и семантический индекс
"src/chutils/**/*.py" = ["api_map.md", "project_index.json"]

# ---------------------------------------------------------------------------
# Модуль config
# ---------------------------------------------------------------------------

# При изменении любого файла конфигурации — обновить docs/api.md
"src/chutils/config/**/*.py" = ["docs/api.md"]
"new:src/chutils/config/sse.py" = ["docs/api.md"]
"new:src/chutils/config/webhook_server.py" = ["docs/api.md"]
"new:src/chutils/config/integrations.py" = ["docs/api.md"]

# При изменении провайдеров конфигурации — обновить специализированную документацию
"new:src/chutils/config/custom_providers.py" = ["docs/custom_config_providers.md"]
"src/chutils/config/custom_providers.py" = ["docs/custom_config_providers.md", "docs/api.md"]

# ---------------------------------------------------------------------------
# Модуль logger
# ---------------------------------------------------------------------------

"src/chutils/logger/**/*.py" = ["docs/api.md"]

# ---------------------------------------------------------------------------
# Модуль secret_manager
# ---------------------------------------------------------------------------

"src/chutils/secret_manager/**/*.py" = ["docs/api.md"]

# ---------------------------------------------------------------------------
# Модуль cache и store
# ---------------------------------------------------------------------------

# Изменения кэша влияют на API и рецепты (там есть примеры использования)
"src/chutils/cache/**/*.py" = ["docs/api.md", "docs/recipes.md"]
"src/chutils/store/**/*.py" = ["docs/store.md", "docs/api.md"]
"new:src/chutils/store/**/*.py" = ["docs/store.md"]

# ---------------------------------------------------------------------------
# Модуль events (шина событий)
# ---------------------------------------------------------------------------

"src/chutils/events/**/*.py" = ["docs/api.md"]

# ---------------------------------------------------------------------------
# Модуль tasks (планировщик)
# ---------------------------------------------------------------------------

"src/chutils/tasks/**/*.py" = ["docs/api.md"]

# ---------------------------------------------------------------------------
# Модуль di (Dependency Injection)
# ---------------------------------------------------------------------------

"src/chutils/di/**/*.py" = ["docs/api.md"]

# ---------------------------------------------------------------------------
# Модуль metrics
# ---------------------------------------------------------------------------

"src/chutils/metrics/**/*.py" = ["docs/api.md"]

# ---------------------------------------------------------------------------
# Модуль diagnostics (мониторинг работоспособности)
# ---------------------------------------------------------------------------

"src/chutils/diagnostics/**/*.py" = ["docs/api.md"]

# ---------------------------------------------------------------------------
# Модуль dev (AI-утилиты разработчика)
# ---------------------------------------------------------------------------

# При создании нового правила линтера — обновить документацию линтера и CLI
"new:src/chutils/dev/rules/*.py" = ["docs/ai_lint.md", "docs/cli/dev.md"]

# При изменении любого файла dev — обновить docs/ai_lint.md и docs/api.md
"src/chutils/dev/**/*.py" = ["docs/ai_lint.md", "docs/api.md"]

# ---------------------------------------------------------------------------
# Отдельные файлы-модули корневого пакета
# ---------------------------------------------------------------------------

# Декораторы — часто используются в рецептах
"src/chutils/decorators.py" = ["docs/api.md", "docs/recipes.md"]

# Файловая система
"src/chutils/fs.py" = ["docs/api.md"]

# Управление жизненным циклом
"src/chutils/lifecycle.py" = ["docs/api.md"]

# Фича-флаги
"src/chutils/features.py" = ["docs/api.md"]

# Манифест окружения
"src/chutils/env.py" = ["docs/api.md"]

# Валидация данных
"src/chutils/validation.py" = ["docs/api.md"]

# Распределённое трассирование
"src/chutils/tracing.py" = ["docs/api.md"]

# Криптография
"src/chutils/crypto.py" = ["docs/api.md"]

# Работа с БД (влияет также на CLI-документацию db)
"src/chutils/db.py" = ["docs/api.md", "docs/cli/db.md"]

# Работа с текстом
"src/chutils/text.py" = ["docs/api.md"]

# Работа со временем
"src/chutils/time.py" = ["docs/api.md"]

# Контекст выполнения
"src/chutils/context.py" = ["docs/api.md"]

# CLI booster (быстрое создание CLI)
"src/chutils/cli_booster.py" = ["docs/api.md"]

# Исключения
"src/chutils/exceptions/**/*.py" = ["docs/api.md"]

# ---------------------------------------------------------------------------
# Модули скрейпинга и капчи
# ---------------------------------------------------------------------------

"src/chutils/scraping/**/*.py" = ["docs/scraping.md"]
"src/chutils/scraping/captcha/**/*.py" = ["docs/captcha.md"]

# ---------------------------------------------------------------------------
# Модуль аудита
# ---------------------------------------------------------------------------

"src/chutils/audit/**/*.py" = ["docs/audit.md"]

# ---------------------------------------------------------------------------
# Система плагинов
# ---------------------------------------------------------------------------

"src/chutils/plugins/**/*.py" = ["docs/plugins.md"]

# ---------------------------------------------------------------------------
# Модуль тестирования
# ---------------------------------------------------------------------------

"src/chutils/testing/**/*.py" = ["docs/testing.md"]

# ---------------------------------------------------------------------------
# HTTP-клиент и Стриминг
# ---------------------------------------------------------------------------

"src/chutils/http/**/*.py" = ["docs/http.md", "docs/api.md"]
"new:src/chutils/http/streaming.py" = ["docs/http.md"]
"src/chutils/web/**/*.py" = ["docs/web.md"]

# ---------------------------------------------------------------------------
# CLI команды
# ---------------------------------------------------------------------------

"src/chutils/commands/dev/**/*.py" = ["docs/cli/dev.md"]
"src/chutils/commands/env.py" = ["docs/cli/env.md"]
"src/chutils/commands/secrets.py" = ["docs/cli/secrets.md"]
"src/chutils/commands/config.py" = ["docs/cli/config.md"]
"src/chutils/commands/init.py" = ["docs/cli/init.md"]
"src/chutils/commands/paths.py" = ["docs/cli/show_paths.md"]
"src/chutils/commands/pypi.py" = ["docs/cli/pypi.md"]
"src/chutils/commands/template.py" = ["docs/cli/template.md"]
"src/chutils/commands/validate.py" = ["docs/cli/validate.md"]
"src/chutils/commands/db.py" = ["docs/cli/db.md"]

# ---------------------------------------------------------------------------
# Корневые файлы проекта
# ---------------------------------------------------------------------------

# При обновлении зависимостей — синхронизировать docs/dependencies.md
"pyproject.toml" = ["docs/dependencies.md"]

# Взаимная зависимость README (рус/англ)
"README.md" = ["docs/README_RU.md"]
"docs/README_RU.md" = ["README.md"]
