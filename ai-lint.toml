[dependencies]
# При изменении исходного кода chutils необходимо перегенерировать карту API и семантический индекс
"src/chutils/**/*.py" = ["api_map.md", "project_index.json"]

# При изменении модуля конфигурации необходимо обновить документацию API
"src/chutils/config/**/*.py" = ["docs/api.md"]

# При изменении провайдеров конфигурации необходимо обновить документацию провайдеров
"new:src/chutils/config/custom_providers.py" = ["docs/custom_config_providers.md"]
"src/chutils/config/custom_providers.py" = ["docs/custom_config_providers.md", "docs/api.md"]

# При создании новых правил линтера необходимо дополнить документацию по линтеру и командам разработчика
"new:src/chutils/dev/rules/*.py" = ["docs/ai_lint.md", "docs/cli/dev.md"]

# При изменении модулей веб-скрейпинга и капчи
"src/chutils/scraping/**/*.py" = ["docs/scraping.md"]
"src/chutils/scraping/captcha/**/*.py" = ["docs/captcha.md"]

# При изменении модуля неизменяемого журнала аудита
"src/chutils/audit/**/*.py" = ["docs/audit.md"]

# При изменении CLI команд необходимо обновить соответствующее руководство
"src/chutils/commands/dev/**/*.py" = ["docs/cli/dev.md"]
"src/chutils/commands/env.py" = ["docs/cli/env.md"]
"src/chutils/commands/secrets.py" = ["docs/cli/secrets.md"]
"src/chutils/commands/config.py" = ["docs/cli/config.md"]
"src/chutils/commands/init.py" = ["docs/cli/init.md"]
"src/chutils/commands/paths.py" = ["docs/cli/show_paths.md"]
"src/chutils/commands/pypi.py" = ["docs/cli/pypi.md"]
"src/chutils/commands/template.py" = ["docs/cli/template.md"]
"src/chutils/commands/validate.py" = ["docs/cli/validate.md"]
"src/chutils/commands/db.py" = ["docs/cli/db.md"]

# При изменении HTTP-клиента
"src/chutils/web/**/*.py" = ["docs/web.md"]

# При изменении системы плагинов
"src/chutils/plugins/**/*.py" = ["docs/plugins.md"]

# При изменении фикстур тестирования
"src/chutils/testing/**/*.py" = ["docs/testing.md"]

# При обновлении пакетов и зависимостей в pyproject.toml
"pyproject.toml" = ["docs/dependencies.md"]

# Взаимная зависимость README файлов (русского и английского)
"README.md" = ["docs/README_RU.md"]
"docs/README_RU.md" = ["README.md"]
